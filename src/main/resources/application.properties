spring.application.name=EmployeesProject
server.port=8080

# PostgreSQL Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/employeedb
spring.datasource.username=postgres
spring.datasource.password=umesh
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate auto table create
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================== KAFKA CONFIGURATION ====================
# Kafka Server ka address (Default port 9092 hota hai)
spring.kafka.bootstrap-servers=localhost:9092

# Producer Settings (Text/String format mein message bhejega)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer Settings (Text/String format mein message receive karega)
spring.kafka.consumer.group-id=employee-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


springdoc.swagger-ui.path=/swagger
